<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minnal Store UI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ── Top bar ──────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-brand">
        <img src="img/logo.svg" class="brand-logo" alt="மின்னல்" />
      </div>
      <div class="topbar-url">
        <label for="base-url-input">API URL</label>
        <input type="text" id="base-url-input" value="http://localhost:8080"
               onkeydown="if(event.key==='Enter') connect()" />
        <button class="btn btn-accent" onclick="connect()">Connect</button>
      </div>
      <div class="topbar-status">
        <span id="health-badge" class="badge badge-unknown">● unknown</span>
        <span id="uptime-label" class="uptime"></span>
      </div>
    </header>

    <!-- ── Sidebar ──────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">STORES</span>
        <button class="btn btn-sm btn-accent" onclick="showCreateStoreModal()">+ New</button>
      </div>
      <div id="store-list" class="store-list">
        <div class="empty-sidebar">Connect to load stores</div>
      </div>
    </aside>

    <!-- ── Main content ─────────────────────────────────────────── -->
    <main class="main">
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="schema"    onclick="switchTab('schema')">Schema</button>
        <button class="tab-btn"        data-tab="documents" onclick="switchTab('documents')">Documents</button>
        <button class="tab-btn"        data-tab="query"     onclick="switchTab('query')">Query</button>
        <button class="tab-btn"        data-tab="admin"     onclick="switchTab('admin')">Admin</button>
      </nav>

      <div class="tab-content">

        <!-- Schema tab -->
        <div id="tab-schema" class="tab-panel active">
          <div class="welcome">
            <p class="welcome-icon">🗄</p>
            <p>Select a store from the sidebar or create a new one.</p>
          </div>
        </div>

        <!-- Documents tab -->
        <div id="tab-documents" class="tab-panel">
          <div class="welcome">
            <p class="welcome-icon">📄</p>
            <p>Select a store first to browse and edit documents.</p>
          </div>
        </div>

        <!-- Query tab -->
        <div id="tab-query" class="tab-panel">
          <div class="welcome">
            <p class="welcome-icon">🔍</p>
            <p>Select a store first to run queries.</p>
          </div>
        </div>

        <!-- Admin tab -->
        <div id="tab-admin" class="tab-panel">
          <div id="admin-content" class="admin-content">
            <div class="welcome">
              <p class="welcome-icon">⚙️</p>
              <p>Connect to view server diagnostics.</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div><!-- .app -->

  <!-- ── Modal overlay ──────────────────────────────────────────── -->
  <div id="modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ── Toast container ────────────────────────────────────────── -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ── Hidden file input for JSON browsing ────────────────────── -->
  <input type="file" id="json-file-input" accept=".json"
         style="display:none" onchange="handleJsonFile(event)" />

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
